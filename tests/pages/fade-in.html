<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fade in</title>
<style>
*{box-sizing:border-box} html,body{margin:0} body{font:16px/1.5 -apple-system,system-ui,"Segoe UI",Inter,sans-serif;color:#eceae6;background:#f7f7f4}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:48px 24px;overflow:hidden}
.hero h1{font-size:clamp(40px,7vw,88px);line-height:1;letter-spacing:-.03em;margin:0 0 18px;font-weight:650}
.hero p{font-size:20px;opacity:.72;margin:0 auto 28px;max-width:34ch}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;background:#eceae6;color:#141617;text-decoration:none;font-weight:600}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 32px;font-weight:600;z-index:3}
.spacer{height:60vh;display:grid;place-items:center;color:#555}.stage{position:relative;min-height:100vh}.stage .bg{position:absolute;inset:0;background:linear-gradient(#2c323b,#131417);opacity:0}.stage .hero{background:none;min-height:100vh}
</style></head><body>
<div class="spacer">Scroll down</div><section class="stage"><div class="bg" id="bg"></div><div class="hero"><nav><span>Northwind</span><span style="opacity:.7">Pricing · Docs · Log in</span></nav><div><h1>Into the dark</h1><p>This background fades in over white as you scroll.</p><a class="btn" href="#">Get started</a></div></div></section><div class="spacer"></div><script>addEventListener("scroll",()=>{const r=document.querySelector(".stage").getBoundingClientRect();document.getElementById("bg").style.opacity=Math.max(0,Math.min(1,1-r.top/innerHeight))},{passive:true})</script>
</body></html>
