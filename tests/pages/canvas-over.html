<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas on top</title>
<style>
*{box-sizing:border-box} html,body{margin:0} body{font:16px/1.5 -apple-system,system-ui,"Segoe UI",Inter,sans-serif;color:#eceae6;background:#141617}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:48px 24px;overflow:hidden}
.hero h1{font-size:clamp(40px,7vw,88px);line-height:1;letter-spacing:-.03em;margin:0 0 18px;font-weight:650}
.hero p{font-size:20px;opacity:.72;margin:0 auto 28px;max-width:34ch}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;background:#eceae6;color:#141617;text-decoration:none;font-weight:600}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 32px;font-weight:600;z-index:3}
.hero{background:linear-gradient(180deg,#3a3d44,#141617)}canvas{position:absolute;inset:0;place-self:stretch;width:100%;height:100%;pointer-events:none}.hero>div{position:relative}
</style></head><body>
<section class="hero" id="hero"><canvas id="c"></canvas><nav><span>Northwind</span><span style="opacity:.7">Pricing · Docs · Log in</span></nav><div><h1>3D on top</h1><p>A canvas draws over part of the background; grain stays under it.</p><a class="btn" href="#">Get started</a></div></section><script>const c=document.getElementById("c"),g=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;g.fillStyle="#c9b9a3";g.beginPath();g.arc(innerWidth*.8,innerHeight*.7,120,0,7);g.fill()</script>
</body></html>
