<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pseudo-element</title>
<style>
*{box-sizing:border-box} html,body{margin:0} body{font:16px/1.5 -apple-system,system-ui,"Segoe UI",Inter,sans-serif;color:#eef;background:#101320}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:48px 24px;overflow:hidden}
.hero h1{font-size:clamp(40px,7vw,88px);line-height:1;letter-spacing:-.03em;margin:0 0 18px;font-weight:650}
.hero p{font-size:20px;opacity:.72;margin:0 auto 28px;max-width:34ch}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;background:#eef;color:#101320;text-decoration:none;font-weight:600}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 32px;font-weight:600;z-index:3}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#1c2340,#101320 60%,#0b0d16)}body{background:#101320}.hero{background:none}
</style></head><body>
<section class="hero" id="hero"><nav><span>Northwind</span><span style="opacity:.7">Pricing · Docs · Log in</span></nav><div><h1>Fixed backdrop</h1><p>The background lives on body::before, fixed to the screen.</p><a class="btn" href="#">Get started</a></div></section>
</body></html>
