<!doctype html>
<meta charset="utf-8" />
<title>grainy-gradients demo stage</title>
<!--
  The stage for the README video: plain gradient cards, no website around them.
  tools/demo-video.mjs loads it in headless Chrome with the grain engine, then:
    1. prepare()      the engine looks at the card and the dark band and solves their grain
    2. pose(name)     holds a still so the tool can photograph real pixels for the zooms
    3. init(data)     receives those photographs back, magnified
    4. seek(seconds)  draws one frame. Nothing runs on a clock, so every render is identical.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0e0e10; }
  body { font: 16px/1.4 -apple-system, 'Inter', system-ui, sans-serif; color: #f3efe8; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .mono { font: 600 12px/1.3 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.1em; }
  .tag { display: inline-block; padding: 5px 11px; border-radius: 7px; background: #1c1c20; border: 1px solid #2c2c32; color: #c9c5bd; }
  .tag.on { color: #f0a25f; border-color: #6b4526; }
  .title { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
  .title i { font: italic 400 38px/1 'Iowan Old Style', 'Palatino', Georgia, serif; letter-spacing: 0; }

  .card { position: absolute; border-radius: 14px; overflow: hidden; isolation: isolate;
    background: linear-gradient(165deg, #0d4a52 0%, #14636a 28%, #e2553a 70%, #f6a868 100%); }
  .band { position: absolute; border-radius: 12px; overflow: hidden; isolation: isolate; background: linear-gradient(90deg, #07171c, #0c272d); }
  .noise { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .under { position: absolute; text-align: center; }

  /* Scene: banding */
  #steps { position: absolute; left: 190px; top: 318px; }
  #steps polyline { fill: none; stroke: #f0a25f; stroke-width: 2; }
  .boost { position: absolute; left: 190px; width: 900px; height: 110px; border-radius: 12px; }

  /* Scene: guessing */
  #slider { position: absolute; left: 440px; top: 520px; width: 400px; display: flex; align-items: center; gap: 14px; }
  #track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: #33333a; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #f0a25f; }
  #thumb { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; }
  #percent { width: 70px; text-align: right; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #readout { position: absolute; left: 0; right: 0; top: 560px; text-align: center; color: #c9c5bd; }
  #s-guess .title { top: 620px; }

  /* Scene: zooms */
  #pick { position: absolute; border: 1.5px solid #fff; border-radius: 3px; }
  #loupe { position: absolute; left: 700px; top: 150px; width: 330px; height: 330px; border-radius: 50%; border: 3px solid #fff; overflow: hidden; background: #000; }
  #loupe img, .square img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  svg.lines { position: absolute; inset: 0; }
  svg.lines line { stroke: #fff; stroke-width: 1.3; stroke-dasharray: 5 5; }
  .square { position: absolute; top: 250px; width: 250px; height: 250px; border-radius: 10px; border: 2.5px solid #fff; overflow: hidden; background: #000; }
  .pickbox { position: absolute; width: 40px; height: 40px; border: 1.5px solid #fff; border-radius: 3px; }
  #numbers { position: absolute; left: 0; right: 0; top: 570px; display: flex; justify-content: center; gap: 70px; text-align: center; }
  #numbers b { display: block; font: 650 28px/1.3 -apple-system, 'Inter', system-ui, sans-serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #numbers em { font-style: normal; color: #f0a25f; }
  #numbers span { color: #8d8a84; }

  #end { display: grid; place-content: center; text-align: center; }
  #end h1 { margin: 0 0 10px; font-size: 64px; font-weight: 650; letter-spacing: -0.035em; }
  #end p { margin: 0 0 30px; font-size: 24px; color: #c9c5bd; }
</style>

<!-- 1. The same gradient twice. -->
<div class="scene" id="s-pair">
  <div class="card" id="pair-a" style="left: 250px; top: 110px; width: 360px; height: 400px"></div>
  <div class="card" id="pair-b" style="left: 670px; top: 110px; width: 360px; height: 400px"><div class="noise"></div></div>
  <div class="under mono" style="left: 250px; top: 530px; width: 360px"><span class="tag">STANDARD</span></div>
  <div class="under mono" style="left: 670px; top: 530px; width: 360px"><span class="tag on">GRADED</span></div>
  <div class="title">Your gradient looks <i>plastic.</i></div>
</div>

<!-- 2. Banding on a dark gradient. -->
<div class="scene" id="s-band">
  <div class="band" id="band" style="left: 190px; top: 110px; width: 900px; height: 110px"><div class="noise"></div></div>
  <div class="under mono" style="left: 190px; top: 234px; width: 900px"><span class="tag">AS SHIPPED</span></div>
  <svg id="steps" width="900" height="70" viewBox="0 0 900 70"><polyline /></svg>
  <img class="boost" id="boost" style="top: 400px" alt="" />
  <div class="under mono" style="left: 190px; top: 524px; width: 900px"><span class="tag on">SAME PIXELS, CONTRAST BOOSTED</span></div>
  <div class="title" style="top: 600px"><i>colour banding</i></div>
</div>

<!-- 3. The usual fix guesses. This one measures. -->
<div class="scene" id="s-guess">
  <div class="card" id="guess" style="left: 440px; top: 70px; width: 400px; height: 420px"><div class="noise"></div></div>
  <div id="slider">
    <span class="tag mono" id="mode">opacity</span>
    <div id="track"><div id="fill"></div><div id="thumb"></div></div>
    <span id="percent"></span>
  </div>
  <div class="mono" id="readout"></div>
  <div class="title" id="guess-title"></div>
</div>

<!-- 4. Zoom into the texture. -->
<div class="scene" id="s-loupe">
  <div class="card" id="loupe-card" style="left: 230px; top: 110px; width: 360px; height: 400px"><div class="noise"></div></div>
  <div id="pick"></div>
  <svg class="lines" viewBox="0 0 1280 720"><line id="l1" /><line id="l2" /></svg>
  <div id="loupe"><img id="loupe-img" alt="" /></div>
  <div class="title">Fine grain. <i>Not</i> a tint.</div>
</div>

<!-- 5. Steps, no steps, and the numbers. -->
<div class="scene" id="s-steps">
  <div class="band" id="steps-a" style="left: 265px; top: 90px; width: 320px; height: 90px"></div>
  <div class="band" id="steps-b" style="left: 695px; top: 90px; width: 320px; height: 90px"><div class="noise"></div></div>
  <div class="pickbox" style="left: 405px; top: 115px"></div>
  <div class="pickbox" style="left: 835px; top: 115px"></div>
  <svg class="lines" viewBox="0 0 1280 720">
    <line x1="405" y1="155" x2="300" y2="250" /><line x1="445" y1="155" x2="550" y2="250" />
    <line x1="835" y1="155" x2="730" y2="250" /><line x1="875" y1="155" x2="980" y2="250" />
  </svg>
  <div class="square" style="left: 300px"><img id="zoom-a" alt="" /></div>
  <div class="square" style="left: 730px"><img id="zoom-b" alt="" /></div>
  <div class="under mono" style="left: 300px; top: 514px; width: 250px"><span class="tag">STEPS</span></div>
  <div class="under mono" style="left: 730px; top: 514px; width: 250px"><span class="tag on">NO STEPS</span></div>
  <div id="numbers" class="mono"></div>
</div>

<div class="scene" id="end">
  <div>
    <h1>grainy-gradients</h1>
    <p>Film grain for CSS gradients. Measured, not guessed.</p>
    <span class="tag on mono" style="font-size: 15px; padding: 9px 16px">npx skills add Farhad1618/grainy-gradients</span>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const clamp = v => Math.max(0, Math.min(1, v));
  const ease = v => (v < 0.5 ? 4 * v ** 3 : 1 - (-2 * v + 2) ** 3 / 2);
  const ramp = (t, from, to) => ease(clamp((t - from) / (to - from)));
  const mix = (a, b, k) => a + (b - a) * k;

  // The storyboard: when each scene is on screen, in seconds.
  const SCENES = { 's-pair': [0, 2.8], 's-band': [2.8, 5.8], 's-guess': [5.8, 9.6], 's-loupe': [9.6, 12], 's-steps': [12, 15], end: [15, 17] };
  const FADE = 0.3;
  const GUESSES = [[0, 0.04], [0.7, 0.15], [1.3, 0.15], [2.0, 0.5], [2.5, 0.5]]; // [seconds into the scene, opacity]
  const MEASURE_AT = 2.7; // seconds into the guessing scene
  const LOUPE_PX = 33; // side of the square the loupe magnifies, in page pixels

  let grain = {}; // { card, band }: what the engine solved for each background
  let data = null;

  const noiseOf = el => el.querySelector('.noise');
  /** Lay the engine's noise tile over an element the way its CSS would. */
  function setNoise(el, g, opacity = g.opacity, blend = g.blend) {
    Object.assign(noiseOf(el).style, {
      backgroundImage: g.tile, backgroundSize: `${g.size}px ${g.size}px`, mixBlendMode: blend, opacity,
    });
  }
  const show = id => { for (const s of document.querySelectorAll('.scene')) s.style.opacity = s.id === id ? 1 : 0; };

  /** Ask the engine about the card and the band, exactly as the skill does on a real page. */
  async function prepare() {
    const solve = async (scene, selector) => {
      show(scene);
      const a = __grain.analyse(await __grain.look(selector, { watch: false, scroll: false }));
      const r = a.results[a.recommended];
      return {
        option: a.recommended, blend: r.blend, opacity: r.screens?.sdr?.opacity ?? r.opacity,
        grain: r.measured.grain, tile: r.urls.layer, size: r.settings.tile,
      };
    };
    grain = { card: await solve('s-guess', '#guess'), band: await solve('s-band', '#band') };
    for (const id of ['pair-b', 'guess', 'loupe-card']) setNoise($(id), grain.card);
    for (const id of ['band', 'steps-b']) setNoise($(id), grain.band);
    return grain;
  }

  /** Hold a still for the tool to photograph, and say where to point the camera. */
  function pose(name) {
    const rect = el => { const r = el.getBoundingClientRect(); return { x: r.x, y: r.y, width: r.width, height: r.height }; };
    if (name === 'band-plain' || name === 'band-grain') {
      show('s-band');
      noiseOf($('band')).style.opacity = name === 'band-grain' ? grain.band.opacity : 0;
      for (const el of [$('steps'), $('boost')]) el.style.visibility = 'hidden';
      return rect($('band'));
    }
    show('s-loupe');
    for (const el of [$('loupe'), $('pick')]) el.style.visibility = 'hidden';
    const r = $('loupe-card').getBoundingClientRect();
    return { x: Math.round(r.x + r.width / 2 - LOUPE_PX / 2), y: Math.round(r.y + r.height * 0.6), width: LOUPE_PX, height: LOUPE_PX };
  }

  /** The photographs come back magnified, with what the tool measured from them. */
  async function init(d) {
    data = d;
    $('boost').src = d.boost;
    $('loupe-img').src = d.loupe;
    $('zoom-a').src = d.zoomBefore;
    $('zoom-b').src = d.zoomAfter;
    $('steps').firstElementChild.setAttribute('points', d.staircase);
    Object.assign($('pick').style, { left: `${d.pick.x}px`, top: `${d.pick.y}px`, width: `${d.pick.width}px`, height: `${d.pick.height}px` });
    const cx = d.pick.x + d.pick.width / 2, cy = d.pick.y + d.pick.height / 2;
    for (const [id, dy] of [['l1', -1], ['l2', 1]]) {
      const l = $(id);
      l.setAttribute('x1', cx); l.setAttribute('y1', cy + dy * d.pick.height / 2);
      l.setAttribute('x2', 820); l.setAttribute('y2', 315 + dy * 160);
    }
    $('numbers').innerHTML = d.numbers.map(([label, value]) => `<div><b>${value}</b><span>${label}</span></div>`).join('');
    for (const el of [$('steps'), $('boost'), $('loupe'), $('pick')]) el.style.visibility = '';
    await Promise.all([...document.images].map(i => i.decode()));
    return SCENES.end[1];
  }

  function seek(t) {
    for (const [id, [from, to]] of Object.entries(SCENES)) {
      const last = id === 'end';
      $(id).style.opacity = ramp(t, from, from + FADE) * (last ? 1 : 1 - ramp(t, to - FADE, to));
    }
    const at = id => t - SCENES[id][0];

    // 1. The graded card's grain arrives a beat after the cards.
    noiseOf($('pair-b')).style.opacity = grain.card.opacity * ramp(at('s-pair'), 0.9, 1.6);

    // 2. Banding: the real strip, then the staircase, then the same pixels boosted.
    noiseOf($('band')).style.opacity = 0;
    const b = at('s-band');
    $('steps').style.clipPath = `inset(0 ${100 - 100 * ramp(b, 0.5, 1.5)}% 0 0)`;
    $('boost').style.opacity = ramp(b, 1.2, 1.7);
    $('boost').nextElementSibling.style.opacity = ramp(b, 1.2, 1.7);

    // 3. Guessing the opacity, then measuring it.
    const g = at('s-guess');
    const measured = g >= MEASURE_AT;
    let opacity = GUESSES[0][1];
    for (let i = 1; i < GUESSES.length; i++) {
      const [t0, v0] = GUESSES[i - 1], [t1, v1] = GUESSES[i];
      if (g >= t0) opacity = mix(v0, v1, ramp(g, t0, t1));
    }
    if (measured) opacity = mix(GUESSES.at(-1)[1], grain.card.opacity, ramp(g, MEASURE_AT, MEASURE_AT + 0.45));
    setNoise($('guess'), grain.card, opacity, measured ? grain.card.blend : 'overlay');
    $('fill').style.width = $('thumb').style.left = `${opacity * 100}%`;
    $('percent').textContent = `${Math.round(opacity * 100)}%`;
    $('mode').textContent = measured ? 'measured' : 'guessed';
    $('mode').className = `tag mono${measured ? ' on' : ''}`;
    $('readout').textContent = measured ? `${grain.card.blend} · ${grain.card.grain.toFixed(2)} L* of visible grain` : 'mix-blend-mode: overlay';
    $('guess-title').innerHTML = measured ? 'This skill <i>measures</i> it.' : 'The usual fix: add noise, <i>guess</i> the opacity.';
    $('guess-title').style.opacity = measured ? ramp(g, MEASURE_AT, MEASURE_AT + 0.3) : 1;

    // 4. The loupe grows out of the square it magnifies.
    const k = ramp(at('s-loupe'), 0.35, 1.0);
    $('loupe').style.transform = `scale(${mix(0.2, 1, k)})`;
    $('loupe').style.opacity = clamp(k * 2.5);
    $('l1').style.opacity = $('l2').style.opacity = clamp((k - 0.6) / 0.4);

    // 5. Steps on the left, then no steps on the right, then the numbers.
    const s = at('s-steps');
    $('zoom-b').parentElement.style.opacity = ramp(s, 0.7, 1.1);
    [...$('numbers').children].forEach((el, i) => { el.style.opacity = ramp(s, 1.4 + i * 0.3, 1.8 + i * 0.3); });

    return new Promise(done => requestAnimationFrame(() => requestAnimationFrame(() => done(1))));
  }
</script>
