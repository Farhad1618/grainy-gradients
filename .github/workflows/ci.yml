name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Format, bundles and engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  pages:
    name: Page tests in headless Chrome
    # macOS: the pixel thresholds were set against Chrome's rendering there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pages
